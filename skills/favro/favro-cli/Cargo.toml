[package]
name = "favro"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Project-configured Favro CLI for human and agent collaboration."
license = "MIT"
readme = "README.md"

[[bin]]
name = "favro"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json", "tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
